<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Kayo Tills</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a 16:9 stage holding all 88 keys in three stacked layers (high on top), a slim bar above, settings and the Hz chart in sheets. */
:root {
  --bg: #eceef1;
  --fg: #16181d;
  --muted: #5d6470;
  --panel: #f7f8fa;
  --line: #d3d7de;
  --accent: #b4232a;
  --accent-fg: #ffffff;
  --case: #1a1b20;
  --white: #f6f5f0;
  --white-2: #dedcd3;
  --edge: #9b988c;
  --black: #26272e;
  --black-2: #08080a;
  --keytext: #4b4a44;
  --scrim: rgba(10, 12, 16, .45);
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --fg: #e8eaee; --muted: #9aa1ad; --panel: #181b21; --line: #2a2e37;
    --accent: #d4434a; --accent-fg: #ffffff; --case: #22252c;
    --white: #e9e7df; --white-2: #c4c1b5; --edge: #6e6b61; --black: #1b1c22; --black-2: #000000;
    --keytext: #55524a; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --fg: #e8eaee; --muted: #9aa1ad; --panel: #181b21; --line: #2a2e37;
  --accent: #d4434a; --accent-fg: #ffffff; --case: #22252c;
  --white: #e9e7df; --white-2: #c4c1b5; --edge: #6e6b61; --black: #1b1c22; --black-2: #000000;
  --keytext: #55524a; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  display: flex; flex-direction: column; gap: 8px;
  padding-block: 6px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}

.bar { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 30px; }
.right { display: flex; align-items: center; gap: 12px; min-width: 0; }
.readout { font-family: var(--font-mono); display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.readout .big { font-size: 1.1rem; font-weight: 500; }
.readout .small { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.gear {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center; padding: 0;
  color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
}
.gear:hover { color: var(--fg); background: var(--panel); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stagewrap { flex: 1 1 0; min-height: 0; display: flex; }
.board {
  flex: 1 1 auto; min-width: 0; container-type: inline-size;
  display: flex; flex-direction: column; gap: 6px;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.layer { contain: layout style; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; background: var(--case); border-radius: 6px 6px 10px 10px; padding: 3px 5px 6px; box-shadow: 0 8px 20px -14px rgba(0,0,0,.6); }
.felt { flex: none; height: 4px; border-radius: 2px; margin-bottom: 4px; }
.keys { position: relative; flex: 1 1 0; min-height: 0; display: flex; }

/* Classic ivory and black keys. Black keys carry a rainbow sheen and base bar in their own hue (--h, red at A0 to magenta at C8).
   A pressed key lights up in that hue instantly and fades out smoothly on release. */
.key { cursor: pointer; }
.key.white {
  position: relative; flex: 1 1 0; min-width: 0;
  background: linear-gradient(to bottom, var(--white) 0%, var(--white) 78%, var(--white-2) 100%);
  border: 1px solid var(--edge); border-top: 0; border-radius: 0 0 6px 6px;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 5px; gap: 1px;
  transition: background .35s ease-out, box-shadow .35s ease-out, transform .15s ease-out;
}
.key.white.down {
  background: linear-gradient(to bottom, hsl(var(--h) 95% 86%) 0%, hsl(var(--h) 90% 66%) 100%);
  box-shadow: 0 0 14px hsl(var(--h) 100% 60% / .7), inset 0 -3px 6px rgba(0,0,0,.18);
  transform: translateY(1.5px); transition: none;
}
.key.black {
  position: absolute; z-index: 2; height: 60%;
  background:
    linear-gradient(115deg, hsl(var(--h) 100% 60% / .42) 0%, hsl(calc(var(--h) + 60) 100% 60% / .16) 45%, transparent 72%),
    linear-gradient(to bottom, var(--black) 0%, var(--black-2) 100%);
  border: 1px solid var(--black-2); border-radius: 0 0 5px 5px;
  box-shadow: inset 0 -5px 0 hsl(var(--h) 95% 55%), 0 3px 4px rgba(0,0,0,.4);
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 8px; line-height: 1.15;
  transition: background .35s ease-out, box-shadow .35s ease-out, transform .15s ease-out;
}
.key.black.down {
  background: linear-gradient(to bottom, hsl(var(--h) 96% 62%) 0%, hsl(var(--h) 96% 34%) 100%);
  box-shadow: 0 0 14px hsl(var(--h) 100% 60% / .8), inset 0 -4px 0 rgba(255,255,255,.25);
  transform: translateY(1px); transition: none;
}
.nm, .nm2, .hz { font-family: var(--font-mono); pointer-events: none; white-space: nowrap; }
.nm { font-size: clamp(8px, 1.25cqw, 20px); font-weight: 600; color: var(--keytext); }
.key.black .nm { color: #fff; font-size: clamp(7px, 0.95cqw, 14px); font-weight: 500; }
.key.black .nm2 { color: rgba(255,255,255,.8); }
.hz { display: none; font-size: clamp(7px, 0.85cqw, 13px); color: var(--muted); }
.board.lab-hz .hz { display: block; }
.board.lab-off .nm, .board.lab-off .nm2, .board.lab-off .hz { display: none; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet {
  position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(380px, 100%);
  background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
  box-shadow: -18px 0 40px -20px rgba(0,0,0,.5);
}
.chart {
  position: fixed; z-index: 23; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(560px, calc(100% - 24px)); height: min(88%, 760px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  display: flex; flex-direction: column; box-shadow: 0 24px 60px -20px rgba(0,0,0,.6); overflow: hidden;
}
.scrim2 { z-index: 22; }
.phead { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.phead h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1; }
.pbody { overflow-y: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 20px; }
.group { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.snote { margin: 0; font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { flex: 1 1 auto; font: inherit; font-size: 14px; color: var(--fg); background: transparent; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; padding: 9px 12px; cursor: pointer; }
.seg button:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.btn { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
.btn:hover { background: color-mix(in srgb, var(--fg) 7%, var(--bg)); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.range input { width: 100%; accent-color: var(--accent); }
.hintline { margin: 0; font-size: 12.5px; color: var(--muted); }
.hintline kbd { font-family: var(--font-mono); font-size: 11.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--fg); }

.cbody { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 0 0 12px; }
.cbody .hintline { padding: 12px 18px 8px; }
table.freq { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.freq th { position: sticky; top: 0; background: var(--panel); text-align: left; font-family: var(--font-body); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 8px 18px; border-bottom: 1px solid var(--line); }
.freq td { padding: 7px 18px; border-bottom: 1px solid var(--line); }
.freq tr.row { cursor: pointer; }
.freq tr.row:hover td { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.freq td.hzc, .freq th.hzc { text-align: right; }
.freq tr.blk td { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.freq .tag { font-family: var(--font-body); font-size: 11.5px; color: var(--accent); margin-left: 8px; }
@media (max-height: 520px) {
  .chart { width: min(640px, calc(100% - 24px)); height: calc(100% - 16px); }
  .phead { padding: 8px 14px; }
  .phead h2 { font-size: 1.25rem; }
  .phead .btn { padding: 6px 12px; }
  .cbody .hintline { padding: 8px 14px 4px; }
  .freq th { padding: 6px 14px; }
  .freq td { padding: 4px 14px; }
}
@media (prefers-reduced-motion: reduce) { .key.white { transition: none; } }
</style>
</head>
<body>
<div class="bar">
  <div class="right">
    <div class="readout" aria-live="polite"><span class="big" id="rdName">&mdash;</span><span class="small" id="rdSub">Touch a key</span></div>
    <button type="button" class="gear" id="openSet" aria-label="Settings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</div>

<div class="stagewrap"><div class="board" id="board" aria-label="Piano keyboard, 88 keys"></div></div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Settings" hidden>
  <div class="phead"><h2>Settings</h2><button type="button" class="btn" id="closeSet">Done</button></div>
  <div class="pbody">
    <div class="group">
      <span class="lbl">Piano</span>
      <div class="seg" id="soundSeg" role="group" aria-label="Piano">
        <button type="button" data-sound="steinway" aria-pressed="true">Steinway &amp; Sons</button>
        <button type="button" data-sound="fazioli" aria-pressed="false">Fazioli</button>
        <button type="button" data-sound="bluthner" aria-pressed="false">Bl&uuml;thner</button>
        <button type="button" data-sound="bechstein" aria-pressed="false">C. Bechstein</button>
      </div>
      <p class="snote" id="soundNote"></p>
    </div>
    <div class="group range"><label class="lbl" for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="70"></div>
    <div class="group range"><label class="lbl" for="verb">Reverb</label><input id="verb" type="range" min="0" max="100" value="25"></div>
    <div class="group">
      <span class="lbl">Sustain pedal</span>
      <button type="button" class="btn" id="pedal" aria-pressed="false">Sustain</button>
    </div>
    <div class="group">
      <span class="lbl">Key labels</span>
      <div class="seg" id="labelSeg" role="group" aria-label="Key labels">
        <button type="button" data-labels="1" aria-pressed="true">Note names</button>
        <button type="button" data-labels="2" aria-pressed="false">Names + Hz</button>
        <button type="button" data-labels="0" aria-pressed="false">Off</button>
      </div>
    </div>
    <div class="group">
      <span class="lbl">Reference</span>
      <button type="button" class="btn" id="openChart">Frequency chart (Hz)</button>
    </div>
    <div class="group" id="screenGroup">
      <span class="lbl">Screen</span>
      <button type="button" class="btn" id="fs">Full screen</button>
    </div>
    <p class="hintline">Hold <kbd>Space</kbd> for sustain. Press lower on a key to play louder, and drag across keys to glide.</p>
  </div>
</aside>

<div class="scrim scrim2" id="scrim2" hidden></div>
<section class="chart" id="chart" role="dialog" aria-modal="true" aria-label="Frequency chart" hidden>
  <div class="phead"><h2>Frequency chart</h2><button type="button" class="btn" id="closeChart">Done</button></div>
  <div class="cbody">
    <p class="hintline">All 88 keys, lowest to highest, in equal temperament with A4 = 440 Hz. Tap a row to hear it.</p>
    <table class="freq"><thead><tr><th>Key</th><th>Note</th><th class="hzc">Hz</th></tr></thead><tbody id="tbody"></tbody></table>
  </div>
</section>
<script>
/* Kayo Tills Android shell: the app is already immersive, so the in-page full screen control is not needed. */
if (/KayoTills/.test(navigator.userAgent)) { var g = document.getElementById("screenGroup"); if (g) g.hidden = true; }
</script>
<script>
(function () {
  var SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  var BLACK = { 1:1, 3:1, 6:1, 8:1, 10:1 };
  var LOWEST = 21, HIGHEST = 108;                       // A0 .. C8
  var ROWS = [[84, 108], [53, 83], [21, 52]];           // top layer (C6-C8), middle (F3-B5), bottom (A0-E3)

  var state = { sound: 'steinway', vol: 0.7, verb: 0.25, latched: false, spaceHeld: false, labels: 1 };
  var active = new Map(), keyEls = new Map(), pointers = new Map();
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board');

  function oct(m) { return Math.floor(m / 12) - 1; }
  function nameS(m) { return SHARP[m % 12] + oct(m); }
  function nameF(m) { return FLAT[m % 12] + oct(m); }
  function nameBoth(m) { return BLACK[m % 12] ? nameS(m) + ' / ' + nameF(m) : nameS(m); }
  function hueFor(m) { return (m - LOWEST) / (HIGHEST - LOWEST) * 320; }
  function freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function hzText(m) { return freq(m).toFixed(2); }

  /* ---------- saved settings (per browser, optional) ---------- */
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem('pocketgrand2') || '{}');
      if (['steinway','fazioli','bluthner','bechstein'].indexOf(s.sound) > -1) state.sound = s.sound;
      if (s.vol >= 0 && s.vol <= 1) state.vol = s.vol;
      if (s.verb >= 0 && s.verb <= 0.9) state.verb = s.verb;
      if (s.labels === 0 || s.labels === 1 || s.labels === 2) state.labels = s.labels;
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem('pocketgrand2', JSON.stringify({ sound: state.sound, vol: state.vol, verb: state.verb, labels: state.labels })); } catch (e) {}
  }

  /* ---------- audio ---------- */
  var ctx, bus, master, dry, wet, conv, comp, noiseBuf;
  function makeIR(sec) {
    var len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = b.getChannelData(c);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    return b;
  }
  function initAudio() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { ctx = new AC(); }
    comp = ctx.createDynamicsCompressor();
    master = ctx.createGain(); master.gain.value = state.vol;
    dry = ctx.createGain(); wet = ctx.createGain(); wet.gain.value = state.verb;
    conv = ctx.createConvolver(); conv.buffer = makeIR(1.8);
    noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.15), ctx.sampleRate);
    (function () { var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; })();
    bus = ctx.createGain();
    bus.connect(dry); bus.connect(conv); conv.connect(wet);
    dry.connect(master); wet.connect(master);
    master.connect(comp); comp.connect(ctx.destination);
  }

  /* Four concert-grand voices, modelled by ear from each maker's reputed character.
     Each note is a set of 1-3 slightly detuned strings with stretched (inharmonic) partials,
     a prompt sound that falls into a longer aftersound, a hammer strike and a velocity-dependent tone. */
  var PIANOS = {
    steinway: { note: 'Powerful, balanced and brilliant, with a rich singing sustain.',
      shape: [1, .9, .7, .55, .4, .3, .22, .16, .1, .06], decay: 6.5, detune: 1.4, tone: 1.0, hammer: 1.0, aliquot: 0, rel: 0.32 },
    fazioli: { note: 'Crystalline and open, with a very long, shimmering treble.',
      shape: [.9, .85, .75, .7, .6, .5, .42, .33, .25, .18, .1], decay: 9, detune: 1.0, tone: 1.3, hammer: 0.7, aliquot: 0, rel: 0.45 },
    bluthner: { note: 'Warm and velvety, with the sympathetic aliquot string halo.',
      shape: [1, .95, .5, .3, .2, .12, .08, .05], decay: 7, detune: 2.0, tone: 0.7, hammer: 0.6, aliquot: 0.07, rel: 0.38 },
    bechstein: { note: 'Clear and articulate, a transparent singing line with a focused middle.',
      shape: [.95, 1, .8, .45, .3, .2, .14, .09], decay: 5, detune: 1.0, tone: 0.9, hammer: 1.1, aliquot: 0, rel: 0.22 }
  };

  function makePiano(key, f, vel) {
    var P = PIANOS[key], t = ctx.currentTime;
    var out = ctx.createGain(), amp = ctx.createGain(), lp = ctx.createBiquadFilter();
    var nodes = [];
    var nStr = f < 90 ? 1 : (f < 220 ? 2 : (f < 1400 ? 3 : 2));
    var cents = nStr === 1 ? [0] : nStr === 2 ? [-P.detune, P.detune] : [-P.detune, 0, P.detune];
    var B = 0.00008 * Math.pow(f / 261, 1.6) + 0.00002;
    var dec = P.decay * Math.min(1.7, Math.max(0.45, 1.65 - Math.log2(f / 110) * 0.2));
    var bright = 0.35 + 0.9 * Math.pow(vel, 1.3);
    var amps = P.shape.map(function (s, i) { return s * (i < 2 ? 1 : bright); });
    var total = amps.reduce(function (a, b) { return a + b; }, 0);

    cents.forEach(function (c) {
      amps.forEach(function (a, i) {
        var h = i + 1, fr = f * h * Math.sqrt(1 + B * h * h);
        if (fr > 9000 || a < 0.035) return;
        var o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = fr; o.detune.value = c * (1 + i * 0.15);
        var g = ctx.createGain(), d = Math.max(0.6, dec / (1 + 0.5 * h)), g0 = a / nStr;
        g.gain.setValueAtTime(g0, t);
        g.gain.exponentialRampToValueAtTime(g0 * 0.4, t + Math.min(0.3, d * 0.3));
        g.gain.exponentialRampToValueAtTime(0.0006, t + d);
        o.connect(g); g.connect(amp); o.start(t); o.stop(t + d + 0.3); nodes.push(o);
      });
    });

    if (P.aliquot && f < 1500) {
      var al = ctx.createOscillator(); al.type = 'sine'; al.frequency.value = f * 2.003;
      var ag = ctx.createGain();
      ag.gain.setValueAtTime(0.0001, t);
      ag.gain.linearRampToValueAtTime(P.aliquot * total * 0.5, t + 0.35);
      ag.gain.exponentialRampToValueAtTime(0.0006, t + dec);
      al.connect(ag); ag.connect(amp); al.start(t); al.stop(t + dec + 0.3); nodes.push(al);
    }

    var src = ctx.createBufferSource(); src.buffer = noiseBuf;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = Math.min(6000, 1200 + f * 2); bp.Q.value = 0.8;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.35 * P.hammer * vel * vel * total * 0.3, t);
    ng.gain.exponentialRampToValueAtTime(0.0005, t + 0.05);
    src.connect(bp); bp.connect(ng); ng.connect(amp); src.start(t); src.stop(t + 0.1);

    var cut = Math.max(f * 4, (1800 + 8000 * vel * vel) * P.tone);
    lp.type = 'lowpass'; lp.Q.value = 0.5;
    lp.frequency.setValueAtTime(Math.min(cut, 18000), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(f * 3, Math.min(cut, 18000) * 0.45), t + 1.5);

    amp.gain.value = 1.2 / total;
    amp.connect(lp); lp.connect(out); out.connect(bus);
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(0.3 * Math.pow(vel, 1.2) + 0.02, t + 0.003);

    return {
      release: function (r) {
        var n = ctx.currentTime, rr = r || P.rel;
        try {
          out.gain.cancelScheduledValues(n);
          out.gain.setTargetAtTime(0, n, rr / 3);
          nodes.forEach(function (o) { try { o.stop(n + rr * 2 + 0.1); } catch (e) {} });
        } catch (e) {}
      }
    };
  }


  /* ---------- notes ---------- */
  function setDown(m, on) { var el = keyEls.get(m); if (el) el.classList.toggle('down', on); }
  function sustaining() { return state.latched || state.spaceHeld; }
  function special(m) { return m === 60 ? ' · Middle C' : m === 69 ? ' · Concert pitch' : m === 21 ? ' · Lowest' : m === 108 ? ' · Highest' : ''; }

  function noteOn(m, vel) {
    var ex = active.get(m);
    if (ex && ex.down) return;
    setDown(m, true);                       // light the key first, before any audio work
    $('rdName').textContent = nameBoth(m);
    $('rdSub').textContent = hzText(m) + ' Hz' + special(m);
    initAudio();
    if (!ctx) return;
    if (ex) ex.voice.release(0.06);
    if (active.size >= 22) {                // keep it smooth: retire the oldest sounding note
      var oldest = null;
      active.forEach(function (a, k) { if (oldest === null && !a.down) oldest = k; });
      if (oldest === null) oldest = active.keys().next().value;
      var o = active.get(oldest);
      if (o) { o.voice.release(0.05); active.delete(oldest); setDown(oldest, false); }
    }
    active.set(m, { voice: makePiano(state.sound, freq(m), vel == null ? 0.8 : vel), down: true });
  }
  function noteOff(m) {
    var a = active.get(m);
    if (!a || !a.down) return;
    a.down = false; setDown(m, false);
    if (!sustaining()) { a.voice.release(); active.delete(m); }
  }
  function flushSustain() {
    if (sustaining()) return;
    active.forEach(function (a, m) { if (!a.down) { a.voice.release(); active.delete(m); } });
  }
  function releaseAll() {
    active.forEach(function (a, m) { a.voice.release(); setDown(m, false); });
    active.clear(); pointers.clear();
  }

  /* ---------- build the 88 keys in three layers ---------- */
  function buildRow(lo, hi) {
    var layer = document.createElement('div'); layer.className = 'layer';
    var felt = document.createElement('div'); felt.className = 'felt'; layer.appendChild(felt);
    felt.style.background = 'linear-gradient(90deg, hsl(' + hueFor(lo).toFixed(0) + ' 92% 58%), hsl(' + hueFor(hi).toFixed(0) + ' 92% 58%))';
    var keys = document.createElement('div'); keys.className = 'keys'; layer.appendChild(keys);
    var W = 0, m;
    for (m = lo; m <= hi; m++) if (!BLACK[m % 12]) W++;
    var wi = 0;
    for (m = lo; m <= hi; m++) {
      var pc = m % 12, el = document.createElement('div');
      el.className = 'key ' + (BLACK[pc] ? 'black' : 'white');
      el.dataset.midi = m; el.dataset.pc = pc;
      el.style.setProperty('--h', hueFor(m).toFixed(1));
      el.setAttribute('role', 'button'); el.setAttribute('aria-label', nameBoth(m));
      if (BLACK[pc]) {
        var w = 100 / W * 0.62;
        el.style.width = w + '%';
        el.style.left = (wi * 100 / W - w / 2) + '%';
        var a = document.createElement('span'); a.className = 'nm'; a.textContent = nameS(m); el.appendChild(a);
        var b = document.createElement('span'); b.className = 'nm nm2'; b.textContent = nameF(m); el.appendChild(b);
      } else {
        wi++;
        var n = document.createElement('span'); n.className = 'nm'; n.textContent = nameS(m); el.appendChild(n);
        var z = document.createElement('span'); z.className = 'hz'; z.textContent = hzText(m); el.appendChild(z);
      }
      keys.appendChild(el); keyEls.set(m, el);
    }
    return layer;
  }
  function applyLabels() {
    board.classList.toggle('lab-off', state.labels === 0);
    board.classList.toggle('lab-hz', state.labels === 2);
  }
  function build() {
    releaseAll();
    board.innerHTML = ''; keyEls.clear();
    ROWS.forEach(function (r) { board.appendChild(buildRow(r[0], r[1])); });
    applyLabels();
  }

  /* ---------- touch and mouse ---------- */
  function keyAt(x, y) { var el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.key') : null; }
  function velocityFor(el, y) {
    var r = el.getBoundingClientRect();
    var f = (y - r.top) / Math.max(1, r.height);
    return Math.min(1, Math.max(0.45, 0.45 + 0.6 * f));
  }
  board.addEventListener('pointerdown', function (e) {
    var k = e.target.closest('.key'); if (!k) return;
    e.preventDefault();
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
    var m = +k.dataset.midi;
    pointers.set(e.pointerId, m);
    noteOn(m, velocityFor(k, e.clientY));
  });
  board.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    var k = keyAt(e.clientX, e.clientY); if (!k) return;
    var m = +k.dataset.midi, prev = pointers.get(e.pointerId);
    if (m === prev) return;
    noteOff(prev); pointers.set(e.pointerId, m);
    noteOn(m, velocityFor(k, e.clientY));
  });
  function up(e) {
    if (!pointers.has(e.pointerId)) return;
    noteOff(pointers.get(e.pointerId)); pointers.delete(e.pointerId);
  }
  board.addEventListener('pointerup', up);
  board.addEventListener('pointercancel', up);
  board.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- sustain and escape ---------- */
  function syncPedal() {
    $('pedal').setAttribute('aria-pressed', sustaining() ? 'true' : 'false');
    flushSustain();
  }
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (!$('chart').hidden) closeChart(); else if (!$('sheet').hidden) closeSheet(); return; }
    if (e.code === 'Space' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.target && e.target.tagName === 'INPUT') return;
      e.preventDefault();
      if (!e.repeat) { state.spaceHeld = true; syncPedal(); }
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space') {
      if (e.target && e.target.tagName === 'INPUT') return;
      e.preventDefault(); state.spaceHeld = false; syncPedal();
    }
  });
  window.addEventListener('blur', function () { state.spaceHeld = false; releaseAll(); syncPedal(); });

  /* ---------- settings sheet ---------- */
  function openSheet() { $('scrim').hidden = false; $('sheet').hidden = false; $('closeSet').focus(); }
  function closeSheet() { $('scrim').hidden = true; $('sheet').hidden = true; $('openSet').focus(); }
  $('openSet').addEventListener('click', openSheet);
  $('closeSet').addEventListener('click', closeSheet);
  $('scrim').addEventListener('click', closeSheet);

  function pressSeg(segId, attr, val) {
    Array.prototype.forEach.call($(segId).children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset[attr]) === String(val) ? 'true' : 'false');
    });
  }
  function updateNote() { $('soundNote').textContent = PIANOS[state.sound].note; }
  function bindSeg(segId, attr, fn) {
    $(segId).addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      fn(b.dataset[attr]); save();
    });
  }
  bindSeg('soundSeg', 'sound', function (v) { state.sound = v; pressSeg('soundSeg', 'sound', v); updateNote(); });
  bindSeg('labelSeg', 'labels', function (v) { state.labels = +v; pressSeg('labelSeg', 'labels', v); applyLabels(); });
  $('pedal').addEventListener('click', function () { state.latched = !state.latched; syncPedal(); });
  $('vol').addEventListener('input', function (e) {
    state.vol = e.target.value / 100;
    if (master) master.gain.setTargetAtTime(state.vol, ctx.currentTime, 0.02);
  });
  $('vol').addEventListener('change', save);
  $('verb').addEventListener('input', function (e) {
    state.verb = e.target.value / 100 * 0.9;
    if (wet) wet.gain.setTargetAtTime(state.verb, ctx.currentTime, 0.02);
  });
  $('verb').addEventListener('change', save);
  $('fs').addEventListener('click', function () {
    try {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(function () {}); }
      else { $('fs').textContent = 'Full screen not available here'; }
    } catch (e) {}
  });

  /* ---------- frequency chart ---------- */
  function buildChart() {
    var tb = $('tbody'), html = '';
    for (var m = LOWEST; m <= HIGHEST; m++) {
      var tag = m === 21 ? 'lowest note' : m === 60 ? 'Middle C' : m === 69 ? 'concert pitch standard' : m === 108 ? 'highest note' : '';
      html += '<tr class="row' + (BLACK[m % 12] ? ' blk' : '') + '" data-midi="' + m + '"><td>' + (m - 20) + '</td><td>' + nameBoth(m) +
        (tag ? '<span class="tag">' + tag + '</span>' : '') + '</td><td class="hzc">' + hzText(m) + '</td></tr>';
    }
    tb.innerHTML = html;
  }
  $('tbody').addEventListener('click', function (e) {
    var tr = e.target.closest('tr.row'); if (!tr) return;
    var m = +tr.dataset.midi;
    noteOn(m, 0.8);
    setTimeout(function () { noteOff(m); }, 900);
  });
  function openChart() { $('sheet').hidden = true; $('scrim').hidden = true; $('scrim2').hidden = false; $('chart').hidden = false; $('closeChart').focus(); }
  function closeChart() { $('scrim2').hidden = true; $('chart').hidden = true; $('openChart').focus(); }
  $('openChart').addEventListener('click', openChart);
  $('closeChart').addEventListener('click', closeChart);
  $('scrim2').addEventListener('click', closeChart);

  window.addEventListener('pointerdown', initAudio, { once: true, capture: true });
  load();
  $('vol').value = Math.round(state.vol * 100);
  $('verb').value = Math.round(state.verb / 0.9 * 100);
  pressSeg('soundSeg', 'sound', state.sound);
  pressSeg('labelSeg', 'labels', state.labels);
  updateNote();
  buildChart();
  build();
})();
</script>
</body>
</html>
